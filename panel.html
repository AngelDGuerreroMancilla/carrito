<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito PseudoInteligente</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- MQTT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
#panelJoystick, #panelMapa{
  transition: all 0.3s ease;
}
</style>

</head>

<body class="bg-primary-subtle">

<div class="container py-4">
<h1 class="text-center mb-4"> Panel de Control</h1>

<!-- TARJETAS -->
<div class="row g-3">
  <div class="col-md-3">
    <div class="card text-bg-primary">
      <div class="card-body">
        <h5>MQTT</h5>
        <p id="estadoMQTT">Conectando...</p>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card border-info">
      <div class="card-body">
        <h5 class="text-info">Distancia</h5>
        <p id="distancia" class="fs-4">-- cm</p>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card border-danger">
      <div class="card-body">
        <h5 class="text-danger">Alerta</h5>
        <p id="alerta">Sin obstáculos</p>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card border-success">
      <div class="card-body">
        <h5 class="text-success">Modo</h5>
        <p id="modoActivo">Manual</p>
      </div>
    </div>
  </div>
</div>

<!-- MODOS -->
<div class="card shadow mt-4">
  <div class="card-body text-center">
    <h3>MODOS</h3>
    <div class="row g-2 mt-3">
      <div class="col-md-3 d-grid">
        <button class="btn btn-outline-primary" onclick="setModo(1)">Sigue lineas</button>
      </div>
      <div class="col-md-3 d-grid">
        <button class="btn btn-outline-danger" onclick="setModo(2)"> Evitar Obstáculos</button>
      </div>
      <div class="col-md-3 d-grid">
        <button class="btn btn-outline-success" onclick="setModo(3)">Joystick</button>
      </div>
      <div class="col-md-3 d-grid">
        <button class="btn btn-outline-warning" onclick="setModo(4)">GPS</button>
      </div>
    </div>
  </div>
</div>

<!-- PANEL DINÁMICO -->
<div class="card shadow mt-4">
  <div class="card-body text-center">

    <h3 id="tituloPanel">Panel de Control</h3>

    <!-- JOYSTICK -->
    <div id="panelJoystick">
      <canvas 
        id="joystickCanvas" 
        width="220" 
        height="220"
        style="touch-action: none; background:#f8f9fa; border-radius:50%;">
      </canvas>
      <p id="coords">X: 0 | Y: 0</p>
    </div>

    <!-- MAPA -->
    <div id="panelMapa" style="display:none;">
      <div id="mapa" style="height:300px;"></div>
    </div>

  </div>
</div>

<!-- CONTROL PID -->
<div class="card shadow mt-4">
  <div class="card-body">
    <h3>Control PID</h3>

    <label>Kp</label>
    <input type="range" id="rangoKp" class="form-range" min="0" max="10" step="0.01">

    <label>Kd</label>
    <input type="range" id="rangoKd" class="form-range" min="0" max="10" step="0.01">

    <label>Ki</label>
    <input type="range" id="rangoKi" class="form-range" min="0" max="1" step="0.001">

    <label>Velocidad Base</label>
    <input type="range" id="rangoVelBas" class="form-range" min="0" max="500">

    <label>Velocidad Máxima</label>
    <input type="range" id="rangoVelMax" class="form-range" min="0" max="500">

    <button class="btn btn-secondary mt-2" id="btnCalib">Calibrar</button>
  </div>
</div>

<!-- GPS CONTROL -->
<div class="card shadow mt-4">
  <div class="card-body text-center">
    <h3>GPS</h3>
    <button class="btn btn-warning" id="btnActGps">Activar GPS</button>
  </div>
</div>

</div>

<script>

/* ========= MQTT ========= */
const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + Math.random());

client.onConnectionLost = () => {
  estadoMQTT.innerText = "Desconectado";
};

client.onMessageArrived = (msg) => {
  if(msg.destinationName === "mi_carrito/web/sensor"){
    let dist = Math.ceil(parseInt(msg.payloadString) * 0.0343 / 2);
    distancia.innerText = dist + " cm";
    alerta.innerText = dist < 20 ? "⚠️ Obstáculo cerca" : "Sin obstáculos";
  }
};

client.connect({
  useSSL:true,
  onSuccess: ()=>{
    estadoMQTT.innerText = "Conectado";
    client.subscribe("mi_carrito/web/sensor");
  }
});

function envDatos(topic, msg){
  let m = new Paho.MQTT.Message(msg);
  m.destinationName = "mi_carrito/esp32/" + topic;
  client.send(m);
}

/* ========= MODOS ========= */
function setModo(m){
  modoActivo.innerText = "Modo " + m;
  envDatos("modo", m.toString());

  panelJoystick.style.display = "none";
  panelMapa.style.display = "none";

  if(m === 3){
    panelJoystick.style.display = "block";
    tituloPanel.innerText = "Joystick (Modo Manual)";
  }

  if(m === 4){
    panelMapa.style.display = "block";
    tituloPanel.innerText = "Mapa GPS";

    setTimeout(()=>{
      map.invalidateSize();
    },200);
  }
}

/* ========= BOTONES ========= */
btnCalib.onclick = ()=> envDatos("calibracion","1");

btnActGps.onclick = ()=>{
  let activo = btnActGps.innerText.includes("Activar");
  envDatos("actGps", activo ? "1":"0");
  btnActGps.innerText = activo ? "Desactivar GPS":"Activar GPS";
};

/* ========= SLIDERS ========= */
rangoKp.oninput = ()=> envDatos("kp", rangoKp.value);
rangoKd.oninput = ()=> envDatos("kd", rangoKd.value);
rangoKi.oninput = ()=> envDatos("ki", rangoKi.value);
rangoVelBas.oninput = ()=> envDatos("velBas", rangoVelBas.value);
rangoVelMax.oninput = ()=> envDatos("velMax", rangoVelMax.value);

/* ========= MAPA ========= */
const map = L.map('mapa').setView([19.4326, -99.1332], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

/* Click para enviar destino */
map.on('click', function(e){
  let lat = e.latlng.lat.toFixed(6);
  let lng = e.latlng.lng.toFixed(6);

  envDatos("gps", lat + "," + lng);
  console.log("Destino enviado:", lat, lng);
});

</script>

<script src="joystick.js"></script>

</body>
</html>
