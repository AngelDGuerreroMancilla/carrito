<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary-subtle">
  <div class="container py-4">
    <h1 class="text-center mb-4"> Panel de Control</h1>

    <div class="row g-3">
      <div class="col-md-3">
        <div class="card text-bg-primary h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Estado MQTT</h5>
            <p class="card-text">Conectando...</p>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card border-info h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-info">Distancia</h5>
            <p class="card-text fs-4">-- cm</p>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card border-danger h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-danger">Alerta</h5>
            <p class="card-text">Sin obstáculos</p>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card border-success h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-success"> Modo</h5>
            <p class="card-text">Manual</p>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow mt-4">
      <div class="card-body text-center">
        <h3 class="mb-3"> Joystick</h3>
        <canvas id="joystickCanvas" width="220" height="220" style="background:#f8f9fa;border-radius:50%;"></canvas>
        <p class="mt-3 fw-bold">X: 0 | Y: 0</p>
      </div>
    </div>
  </div>
</body>
</html>
