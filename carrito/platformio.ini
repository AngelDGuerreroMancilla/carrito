; PlatformIO Project Configuration File

[env:mi_placa_yd_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM11

; Forzamos los 16MB de Flash y los 8MB de PSRAM
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; TODOS LOS FLAGS AGRUPADOS AQUÍ
build_flags = 
    -DBOARD_HAS_PSRAM             ; Habilita físicamente el uso de la PSRAM
    -DARDUINO_USB_MODE=1          ; Habilita el modo USB nativo del ESP32-S3
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Redirige 'Serial.print' y el auto-reset al puerto USB (Ayuda a evitar presionar el botón BOOT)

lib_deps =
    knolleary/PubSubClient @ ^2.8.0