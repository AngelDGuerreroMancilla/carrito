<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Carrito ESP32</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script> 
</head>
<body>
    
    <div>
        <h2>Monitor del Carrito</h2>
        <p>Estado MQTT: <span id="estado" style="font-weight: bold; color: orange;">Conectando...</span></p>
        
        <h3>Distancia Actual:</h3>
        <div id="distancia" style="font-size: 24px; font-weight: bold; color: blue;">-- cm</div>

        <p id="mensaje_alerta" style="color: red; font-weight: bold;"></p>
    </div>
    <div>
        <h2>Modo seguidor de lineas</h2>
        <button id="btnSegLin">Desactivado</button>
    </div>
    <div style="text-align: center; margin-top: 50px;">
    <canvas id="joystickCanvas" width="200" height="200" style="background-color: #f0f0f0; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.2);"></canvas>
    
    <h3 style="font-family: sans-serif;">
        Eje X: <span id="valorX">0</span> | Eje Y: <span id="valorY">0</span>
    </h3>
</div>
    <script>
       

             let btnSegLin= document.getElementById("btnSegLin");


        btnSegLin.addEventListener("click",() =>{

            if(btnSegLin.textContent =="Desactivado"){
                btnSegLin.innerText="Activado";
                envDatos("seguidorLineas", "1");
                console.log("env1");
            }
            else if(btnSegLin.textContent== "Activado"){
                btnSegLin.innerText="Desactivado";
                envDatos("seguidorLineas", "0");
                console.log("env0");
            }
        })
            
        
        // 1. Configuración del Broker
        const broker = "broker.hivemq.com";
        const puerto = 8884; // Usamos un puerto web seguro (WSS)
        const clientId = "WebClient-" + Math.random().toString(16).substr(2, 8);

        // 2. Crear el cliente MQTT para la web
        const client = new Paho.MQTT.Client(broker, puerto, clientId); 

        // 3. Qué hacer si se cae el internet
        client.onConnectionLost = function(responseObject) { 
            if (responseObject.errorCode !== 0) {
                document.getElementById("estado").innerText = "Desconectado";
                document.getElementById("estado").style.color = "red";
                console.log("Conexión perdida: " + responseObject.errorMessage);
            }
        };

        // 4. Qué hacer cuando llega un mensaje del ESP32
        client.onMessageArrived = function(message) {
            // CORRECCIÓN: Escuchamos el canal por donde habla el ESP32
            if(message.destinationName === "mi_carrito/web/sensor") { 
                
                // Convertimos el texto (duración) que llega a número entero
                let dur = parseInt(message.payloadString);
                calcDistSens(dur);
            }
        };

        function calcDistSens(dur){
            let distSensUlt = Math.ceil(dur * 0.0343 / 2);
            
            // ¡NUEVO!: Actualizamos la pantalla de tu web para ver el número
            document.getElementById("distancia").innerText = distSensUlt + " cm";
            
            // Lógica visual extra: Mostrar alerta en la web si está muy cerca
            if(distSensUlt <= 20) {
                document.getElementById("mensaje_alerta").innerText = "¡ALERTA! Obstáculo cerca.";
            } else {
                document.getElementById("mensaje_alerta").innerText = ""; // Borramos la alerta
            }
          
            // Le respondemos al ESP32 con la distancia ya calculada
            envDatos("sensor", distSensUlt.toString());
        }

        // Función para hablarle de vuelta al ESP32
        function envDatos(topic, comando) {
            let mensaje = new Paho.MQTT.Message(comando);
            // Esto mandará el mensaje a "mi_carrito/esp32/sensor"
            mensaje.destinationName = `mi_carrito/esp32/${topic}`; 
            client.send(mensaje);
            console.log("enviado")
        }

        // 5. Opciones y ejecución de la conexión
        let opciones = {
            useSSL: true, 
            onSuccess: function() {
                document.getElementById("estado").innerText = "Conectado";
                document.getElementById("estado").style.color = "green";
                console.log("Conectado a MQTT!");
                
                // CORRECCIÓN: Nos suscribimos al canal donde el ESP32 manda la duración
                client.subscribe("mi_carrito/web/sensor"); 
            },
            onFailure: function(message) {
                document.getElementById("estado").innerText = "Error al conectar";
                document.getElementById("estado").style.color = "red";
                console.log("Falló conexión: " + message.errorMessage);
            }
        };

        // Dar la orden final de conectar
        client.connect(opciones);

        
        
    </script>
    <script src="./joystick.js"></script>
</body>
</html>
